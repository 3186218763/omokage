llm:
  api_key: "sk-your-api-key"
  # OpenAI Responses API（/v1/responses）。base_url 填兼容网关根地址。
  base_url: "https://api.openai.com/v1"
  model: "gpt-4.1-mini"
  # Voice-oriented replies should be concise and varied without becoming
  # unpredictable. Conversation summaries use a separate low temperature.
  temperature: 0.8
  max_tokens: 400

tts:
  # Locked Huayin Style-Bert-VITS2 API (POST /tts {"text": "..."}).
  # Speaker / style / model are fixed on the server; the client only sends text.
  base_url: "http://127.0.0.1:5000"
  model_name: huayin
  speaker_name: 花音
  style: Neutral
  length: 1.0
  timeout: 60.0

asr:
  model: "small"
  device: "auto"
  compute_type: "auto"
  language: "auto"
  beam_size: 5
  max_upload_mb: 15

conversation:
  # Keep recent turns verbatim and compact older complete turns into memory.
  recent_turns: 8
  summary_trigger_turns: 12
  summary_trigger_chars: 12000
  summary_max_chars: 1800
  # SQLite recovery store. Set to an empty string to keep sessions in memory only.
  database_path: "data/sessions.db"
  # 轮末是否向前端发 timing 事件（每轮时延观测；前端不消费，debug 用）。
  timing_event: true

streaming:
  min_sentence_chars: 4
  max_sentence_chars: 50
  # TTS 预取深度：每句事件先行、合成进按序队列，队列满才下发最旧音频。
  # 1 = 旧行为（逐句串行）；2-3 = 预取，句间 gap 更小。上限 3（保护单卡 SBV2）。
  tts_prefetch_depth: 2
  # 可选 mp3（需要 ffmpeg）；不可用时服务回落 WAV。
  audio_encoding: wav
  audio_bitrate_kbps: 96

# 表演情绪。未启用时脸跟说话语气走。
# 本地 Kev：base_url 写到 /v1/systemone，密钥填任意非空字符串（服务未设 KEV_API_KEY 时会忽略）。
# 启动：bash scripts/run_kev.sh
jev:
  enabled: false
  base_url: "http://127.0.0.1:8009/v1/systemone"
  api_key: "local"
  model: "kev-latest"
  timeout_seconds: 2.0
  min_confidence: 0.4
  fail_cooldown_seconds: 60

# 空 model_dir：有 baicai 用 baicai，否则 hiyori。路径必须在 resources/live2d/ 内。
# 空 background：自动用 backgrounds/clubroom-day.jpg（无则按文件名排序取第一张）。路径同样必须在 resources/live2d/ 内。
live2d:
  model_dir: ""
  background: ""
